<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/web/tasks}">📋 Задачи</a>
    <a th:href="@{/web/tasks/new}">+ Новая</a>
    <a th:href="@{/web/audit}">📜 Журнал</a>
    <span class="spacer"></span>
    <button type="button" onclick="toggleTheme()" class="btn btn-secondary btn-sm" id="theme-btn">🌙</button>
    <span class="user">👤 <span sec:authentication="name">guest</span></span>
    <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
        <button type="submit" class="btn btn-secondary btn-sm">Выйти</button>
    </form>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeButton();
        }
        function updateThemeButton() {
            const btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        }
        updateThemeButton();
    </script>
</nav>
</body>
</html>
