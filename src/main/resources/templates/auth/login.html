<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<form class="auth-form" th:action="@{/login}" method="post">
    <h2>Вход в Task Manager</h2>

    <div th:if="${param.error}" class="alert alert-error">Неверный email или пароль</div>
    <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
    <div th:if="${param.registered}" class="alert alert-success">Регистрация успешна. Войдите с новыми данными.</div>

    <p>Email
        <input type="text" name="username" required autofocus/>
    </p>
    <p>Пароль
        <input type="password" name="password" required/>
    </p>
    <button type="submit" class="btn btn-primary">Войти</button>

    <p class="link">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</form>

</body>
</html>
