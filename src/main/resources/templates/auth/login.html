<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="auth-page">

<button type="button" onclick="toggleTheme()" class="btn btn-secondary theme-floating" id="theme-btn">🌙</button>

<form class="auth-form" th:action="@{/login}" method="post">
    <h2>Вход в Task Manager</h2>

    <div th:if="${param.error}" class="alert alert-error">Неверный email или пароль</div>
    <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
    <div th:if="${param.registered}" class="alert alert-success">Регистрация успешна. Войдите с новыми данными.</div>

    <p>Email
        <input type="text" name="username" required autofocus/>
    </p>
    <p>Пароль
        <input type="password" name="password" required/>
    </p>
    <button type="submit" class="btn btn-primary">Войти</button>

    <p class="link">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</form>

<script>
    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeButton();
    }
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }
    document.addEventListener('DOMContentLoaded', updateThemeButton);
</script>
</body>
</html>
