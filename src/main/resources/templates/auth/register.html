<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body>

<button type="button" onclick="toggleTheme()" class="btn btn-secondary theme-floating" id="theme-btn">🌙</button>

<form class="auth-form" th:action="@{/register}" method="post">
    <h2>Регистрация</h2>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <p>Email
        <input type="email" name="email" required th:value="${email}" autofocus/>
    </p>
    <p>Пароль (минимум 6 символов)
        <input type="password" name="password" required minlength="6"/>
    </p>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>

    <p class="link">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</form>

<script>
    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeButton();
    }
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }
    document.addEventListener('DOMContentLoaded', updateThemeButton);
</script>
</body>
</html>
